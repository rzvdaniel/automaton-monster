name: Checks

# Language-agnostic checks on every pull request: the gate's own tests, every app's manifest, pinned action SHAs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tests of the merge gate, issue check and pin check
        run: python -m unittest discover -s .agents/tools -p 'test_*.py'
      - name: Every app has a valid automaton.json
        run: python tools/check_manifests.py
      - name: Actions are pinned to commit SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .agents/tools/check-action-pins.py
